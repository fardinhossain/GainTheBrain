name: Daily Project Idea Agent

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-project-idea-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-project-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_URL: ${{ secrets.AI_API_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEP_SEEK_API_KEY: ${{ secrets.DEEP_SEEK_API_KEY }}
      DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      GIT_COMMIT_NAME: ${{ secrets.GIT_COMMIT_NAME }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      GITHUB_BRANCH: main
      SKIP_GIT_PUSH: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: git pull --ff-only origin "$GITHUB_BRANCH"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate agent secrets
        shell: bash
        run: |
          missing=()
          for name in AI_API_KEY AI_API_URL AI_MODEL GIT_COMMIT_NAME GIT_COMMIT_EMAIL; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Run daily project idea agent
        run: python scripts/daily_project_agent.py
